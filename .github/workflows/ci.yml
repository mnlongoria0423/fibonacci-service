name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported LTS through current, so engine upgrades are
        # caught before they reach production.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run test:coverage

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fibonacci-service:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name fib -p 8080:8080 fibonacci-service:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/readyz && break
            sleep 0.5
          done
          test "$(curl -fsS 'http://localhost:8080/v1/fibonacci?n=5')" = "[0,1,1,2,3]"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/v1/fibonacci?n=-1')" = "400"
          docker stop fib
